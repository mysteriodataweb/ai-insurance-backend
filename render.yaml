services:
  - type: web
    name: ai-insurance-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
